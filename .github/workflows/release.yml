name: Release

# Tag vX.Y.Z to cut a release: builds the self-contained MSI and publishes a
# GitHub release with it attached. Keep the OpenAdoration-<ver>-win-x64.msi asset
# name stable — the planned in-app auto-updater (M8.2, not yet built) will parse it.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write  # create the release + upload the MSI asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.2

      # Tag/ref values are attacker-influenceable (anyone who can push a tag controls this
      # string), so every step below passes them through `env:` and reads via $env:NAME
      # instead of interpolating `${{ }}` into the script body — GitHub substitutes `${{ }}`
      # as raw text before the shell parses it, so embedding it directly is a script-injection
      # vector (e.g. a tag containing an embedded quote + command). Env-var passing lets
      # PowerShell treat the value as inert data instead.
      - name: Derive version from tag
        id: ver
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = $env:REF_NAME.TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Verify csproj version matches the tag
        shell: pwsh
        env:
          TAG_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $proj = ([xml](Get-Content OpenAdoration.WPF/OpenAdoration.WPF.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($proj -ne $env:TAG_VERSION) {
            throw "csproj <Version> ($proj) != tag ($env:TAG_VERSION). Bump the csproj before tagging."
          }

      # build.ps1 stages the FFmpeg LGPL binaries (fetch-ffmpeg.ps1), publishes the
      # single-file exe, and builds the MSI into installer/out/.
      - name: Build MSI
        shell: pwsh
        env:
          TAG_VERSION: ${{ steps.ver.outputs.version }}
        run: ./installer/build.ps1 -Version $env:TAG_VERSION

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          TAG_VERSION: ${{ steps.ver.outputs.version }}
        run: >
          gh release create "$env:REF_NAME"
          "installer/out/OpenAdoration-$env:TAG_VERSION-win-x64.msi"
          --title "OpenAdoration $env:TAG_VERSION"
          --generate-notes
